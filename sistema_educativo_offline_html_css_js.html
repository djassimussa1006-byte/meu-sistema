<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola PRO - Sistema com Acessos</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{background:#111827;padding:15px;text-align:center}

.container{display:flex;height:100vh}

/* LOGIN */
.loginBox{
max-width:400px;
margin:80px auto;
background:#1e293b;
padding:20px;
border-radius:10px;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#1e293b;
padding:10px;
display:none;
}

.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#334155;
color:white;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
padding:20px;
overflow:auto;
display:none;
}

.card{
background:#1f2937;
padding:15px;
margin:10px 0;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
}

button{
padding:10px;
background:#3b82f6;
border:none;
color:white;
cursor:pointer;
width:100%;
}

.hidden{display:none}
</style>

</head>

<body>

<header>
<h1>🏫 Escola PRO - Sistema com Perfis</h1>
</header>

<!-- LOGIN -->
<div id="loginScreen" class="loginBox">
<h2>🔐 Login Obrigatório</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Senha">

<select id="role">
<option value="aluno">Aluno</option>
<option value="professor">Professor</option>
<option value="admin">Admin</option>
</select>

<button onclick="login()">Entrar</button>

<p id="msg"></p>
</div>

<!-- SISTEMA -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<button onclick="showPanel('dashboard')">📊 Dashboard</button>
<button onclick="showPanel('disciplinas')">📚 Disciplinas</button>
<button onclick="showPanel('quiz')">📝 Exercícios</button>
<button onclick="showPanel('admin')">🛠 Admin</button>

</div>

<!-- MAIN -->
<div class="main" id="main">

<!-- DASHBOARD -->
<section id="dashboard">
<h2>📊 Painel</h2>
<div class="card" id="info"></div>
</section>

<!-- DISCIPLINAS -->
<section id="disciplinas" class="hidden">
<h2>📚 Disciplinas</h2>
<input id="disc" placeholder="Nova disciplina">
<button onclick="addDisc()">Adicionar</button>
<div id="listDisc"></div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
<h2>📝 Exercícios</h2>
<div id="quizBox"></div>
</section>

<!-- ADMIN -->
<section id="admin" class="hidden">
<h2>🛠 Admin Panel</h2>
<div class="card" id="adminPanel"></div>
</section>

</div>
</div>

<script>

/* =========================
   USUÁRIOS (SIMULAÇÃO)
========================= */

const users = [
{email:"aluno@escola.com",password:"1234",role:"aluno"},
{email:"prof@escola.com",password:"1234",role:"professor"},
{email:"admin@escola.com",password:"1234",role:"admin"}
];

let currentUser=null;

/* =========================
   LOGIN OBRIGATÓRIO
========================= */

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;
let role=document.getElementById("role").value;

let user = users.find(u=>u.email===email && u.password===password && u.role===role);

if(!user){
document.getElementById("msg").innerText="❌ Login inválido";
return;
}

currentUser=user;

/* mostra sistema */
document.getElementById("loginScreen").style.display="none";
document.getElementById("sidebar").style.display="block";
document.getElementById("main").style.display="block";

loadDashboard();
}

/* =========================
   CONTROLO DE ACESSO
========================= */

function showPanel(panel){

if(!currentUser) return;

if(panel==="admin" && currentUser.role!=="admin"){
alert("Acesso negado!");
return;
}

document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
document.getElementById(panel).classList.remove("hidden");

}

/* =========================
   DASHBOARD
========================= */

function loadDashboard(){

let role=currentUser.role;

document.getElementById("info").innerHTML=`
👤 Utilizador: ${currentUser.email}<br>
🔐 Tipo: ${role}<br>
🏫 Sistema ativo offline
`;

/* permissões visuais */
if(role==="admin"){
document.getElementById("adminPanel").innerHTML=
"✔ Acesso total ao sistema";
}

}

/* =========================
   DISCIPLINAS
========================= */

let disciplines=[];

function addDisc(){

if(currentUser.role==="aluno"){
alert("Sem permissão");
return;
}

let d=document.getElementById("disc").value;
disciplines.push(d);

renderDisc();
}

function renderDisc(){

let div=document.getElementById("listDisc");
div.innerHTML="";

disciplines.forEach(d=>{
div.innerHTML+=`
<div class="card">📚 ${d}</div>`;
});

}

/* =========================
   QUIZ
========================= */

let quiz=[
{q:"2+2?",a:["3","4"],c:1}
];

let i=0,score=0;

function loadQuiz(){

let box=document.getElementById("quizBox");

if(i>=quiz.length){
box.innerHTML="✔ Resultado: "+score;
return;
}

let q=quiz[i];

box.innerHTML="<p>"+q.q+"</p>";

q.a.forEach((a,idx)=>{
box.innerHTML+=`
<button onclick="answer(${idx})">${a}</button><br>`;
});

}

function answer(idx){
if(idx==quiz[i].c) score++;
i++;
loadQuiz();
}

loadQuiz();

</script>

</body>
</html>
