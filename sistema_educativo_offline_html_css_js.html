<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Escolar PRO</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#111827;padding:15px;text-align:center}
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:240px;
background:#1e293b;
padding:10px;
}
.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#334155;
color:white;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
padding:20px;
overflow:auto;
}

.card{
background:#1f2937;
padding:15px;
margin:10px 0;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
}

button.action{
padding:10px;
background:#3b82f6;
border:none;
color:white;
cursor:pointer;
width:100%;
}

.hidden{display:none}
</style>

</head>

<body>

<header>
<h1>🏫 Plataforma Escolar PRO (Offline Demo)</h1>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button onclick="show('login')">🔐 Login</button>
<button onclick="show('dashboard')">📊 Dashboard</button>
<button onclick="show('escolas')">🏫 Escolas</button>
<button onclick="show('alunos')">👨‍🎓 Alunos</button>
<button onclick="show('professores')">👨‍🏫 Professores</button>
<button onclick="show('disciplinas')">📚 Disciplinas</button>
<button onclick="show('quiz')">📝 Exercícios</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- LOGIN -->
<section id="login">
<h2>Login (simulado)</h2>
<input id="email" placeholder="email">
<input id="pass" placeholder="senha" type="password">
<select id="role">
<option>Aluno</option>
<option>Professor</option>
<option>Admin</option>
</select>
<button class="action" onclick="login()">Entrar</button>
<p id="log"></p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">
<h2>📊 Dashboard</h2>
<div class="card" id="stats"></div>
</section>

<!-- ESCOLAS -->
<section id="escolas" class="hidden">
<h2>🏫 Escolas</h2>
<input id="schoolName" placeholder="Nome da escola">
<button class="action" onclick="addSchool()">Adicionar</button>
<div id="schoolList"></div>
</section>

<!-- ALUNOS -->
<section id="alunos" class="hidden">
<h2>👨‍🎓 Alunos</h2>
<input id="studentName" placeholder="Nome do aluno">
<select id="studentSchool"></select>
<button class="action" onclick="addStudent()">Adicionar aluno</button>
<div id="students"></div>
</section>

<!-- PROFESSORES -->
<section id="professores" class="hidden">
<h2>👨‍🏫 Professores</h2>
<input id="teacherName" placeholder="Nome do professor">
<select id="teacherSchool"></select>
<button class="action" onclick="addTeacher()">Adicionar</button>
<div id="teachers"></div>
</section>

<!-- DISCIPLINAS -->
<section id="disciplinas" class="hidden">
<h2>📚 Disciplinas</h2>
<input id="subject" placeholder="Disciplina">
<button class="action" onclick="addSubject()">Adicionar</button>
<div id="subjects"></div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
<h2>📝 Exercícios</h2>
<div id="quizBox"></div>
</section>

</div>
</div>

<script>
 
let db = {
schools:[],
students:[],
teachers:[],
subjects:[],
results:[]
};

function show(id){
document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
updateAll();
}

let user=null;

function login(){
let email=document.getElementById("email").value;
let role=document.getElementById("role").value;

user={email,role};

document.getElementById("log").innerText=
"Logado como "+role;

}

function addSchool(){
let name=document.getElementById("schoolName").value;

db.schools.push({id:Date.now(),name});

updateAll();
}

function renderSchools(){
let div=document.getElementById("schoolList");
div.innerHTML="";

db.schools.forEach(s=>{
div.innerHTML+=`
<div class="card">🏫 ${s.name}</div>`;
});
}

function addStudent(){
let name=document.getElementById("studentName").value;
let school=document.getElementById("studentSchool").value;

db.students.push({name,school});

updateAll();
}

function renderStudents(){
let div=document.getElementById("students");
div.innerHTML="";

db.students.forEach(s=>{
div.innerHTML+=`
<div class="card">👨‍🎓 ${s.name} (${s.school})</div>`;
});
}

function addTeacher(){
let name=document.getElementById("teacherName").value;
let school=document.getElementById("teacherSchool").value;

db.teachers.push({name,school});

updateAll();
}

function renderTeachers(){
let div=document.getElementById("teachers");
div.innerHTML="";

db.teachers.forEach(t=>{
div.innerHTML+=`
<div class="card">👨‍🏫 ${t.name} (${t.school})</div>`;
});
}

function addSubject(){
let s=document.getElementById("subject").value;

db.subjects.push(s);

updateAll();
}

function renderSubjects(){
let div=document.getElementById("subjects");
div.innerHTML="";

db.subjects.forEach(s=>{
div.innerHTML+=`
<div class="card">📚 ${s}</div>`;
});
}

let quiz=[
{q:"2+2?",a:["3","4"],c:1},
{q:"Capital da Guiné-Bissau?",a:["Bissau","Bafatá"],c:0}
];

let i=0,score=0;

function loadQuiz(){
let box=document.getElementById("quizBox");

if(i>=quiz.length){
db.results.push(score);

box.innerHTML="<h3>Resultado: "+score+"</h3>";
return;
}

let q=quiz[i];

box.innerHTML="<p>"+q.q+"</p>";

q.a.forEach((a,idx)=>{
box.innerHTML+=`
<button onclick="answer(${idx})">${a}</button><br>`;
});
}

function answer(idx){
if(idx==quiz[i].c) score++;
i++;
loadQuiz();
}

function renderDashboard(){
document.getElementById("stats").innerHTML=`
🏫 Escolas: ${db.schools.length}<br>
👨‍🎓 Alunos: ${db.students.length}<br>
👨‍🏫 Professores: ${db.teachers.length}<br>
📚 Disciplinas: ${db.subjects.length}<br>
📝 Resultados: ${db.results.length}
`;
}

function updateAll(){
renderSchools();
renderStudents();
renderTeachers();
renderSubjects();
renderDashboard();
}

loadQuiz();
updateAll();

</script>

</body>
</html>
