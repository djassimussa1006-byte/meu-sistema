<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Offline PRO</title>

<style>
body{margin:0;font-family:Arial;background:#f1f3f6}
header{background:#1e293b;color:white;padding:15px;text-align:center}
.container{display:flex;height:100vh}
.sidebar{width:220px;background:#0f172a;color:white;padding:10px}
.sidebar button{width:100%;padding:10px;margin:5px 0;border:none;background:#1e293b;color:white;cursor:pointer}
.main{flex:1;padding:20px;overflow:auto}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.hidden{display:none}
input{padding:10px;width:100%;margin:5px 0}
button.action{background:#2563eb;color:white;border:none;padding:10px;margin-top:10px}
</style>
</head>
<body>
<header><h1>📚 Escola Offline PRO</h1></header>

<div class="container">

<div class="sidebar">
<button onclick="show('home')">🏠 Início</button>
<button onclick="show('disciplinas')">📘 Disciplinas</button>
<button onclick="show('quiz')">📝 Exercícios</button>
<button onclick="show('relatorios')">📊 Relatórios</button>
</div>

<div class="main">

<section id="home">
<h2>Login</h2>
<input id="nome" placeholder="Nome do aluno">
<button class="action" onclick="login()">Entrar</button>
<p id="user"></p>
</section>

<section id="disciplinas" class="hidden">
<h2>Disciplinas</h2>
<div id="listaDisciplinas"></div>
<div id="listaAulas"></div>
</section>

<section id="quiz" class="hidden">
<h2>Exercícios</h2>
<div id="quizBox"></div>
</section>

<section id="relatorios" class="hidden">
<h2>Relatórios</h2>
<div id="relatorio"></div>
</section>

</div>
</div>

<script>
// NAVEGAÇÃO
function show(id){
 document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}

// DATABASE
let db;
const req=indexedDB.open('EscolaPRO',1);
req.onupgradeneeded=e=>{
 db=e.target.result;
 db.createObjectStore('alunos',{keyPath:'id',autoIncrement:true});
 db.createObjectStore('resultados',{keyPath:'id',autoIncrement:true});
};
req.onsuccess=e=>db=e.target.result;

function salvarAluno(nome){
 db.transaction('alunos','readwrite').objectStore('alunos').add({nome});
}

function salvarResultado(r){
 db.transaction('resultados','readwrite').objectStore('resultados').add(r);
}

function listarResultados(cb){
 let r=db.transaction('resultados').objectStore('resultados').getAll();
 r.onsuccess=()=>cb(r.result);
}

// LOGIN
let alunoAtual=null;
function login(){
 let nome=document.getElementById('nome').value;
 if(!nome) return alert('Digite um nome');
 alunoAtual=nome;
 salvarAluno(nome);
 document.getElementById('user').innerText='Aluno: '+nome;
}

// DISCIPLINAS
const dados={
 Matemática:['Soma','Subtração','Multiplicação'],
 Português:['Leitura','Gramática']
};

function carregarDisciplinas(){
 let d=document.getElementById('listaDisciplinas');
 d.innerHTML='';
 Object.keys(dados).forEach(nome=>{
  let b=document.createElement('button');
  b.innerText=nome;
  b.onclick=()=>mostrarAulas(nome);
  d.appendChild(b);
 });
}

function mostrarAulas(nome){
 let div=document.getElementById('listaAulas');
 div.innerHTML='';
 dados[nome].forEach(a=>{
  let el=document.createElement('div');
  el.className='card';
  el.innerText=a;
  div.appendChild(el);
 });
}

carregarDisciplinas();

// QUIZ
const quiz=[
 {q:'2+2?',a:['3','4'],c:1},
 {q:'5x2?',a:['10','8'],c:0},
 {q:'Capital?',a:['Bissau','Dakar'],c:0}
];

let i=0,score=0;
function loadQuiz(){
 let box=document.getElementById('quizBox');
 if(i>=quiz.length){
  salvarResultado({aluno:alunoAtual,score});
  box.innerHTML=`<h3>Pontuação: ${score}</h3>`;
  gerarRelatorio();
  return;
 }
 let q=quiz[i];
 box.innerHTML=`<p>${q.q}</p>`;
 q.a.forEach((opt,idx)=>{
  let b=document.createElement('button');
  b.innerText=opt;
  b.onclick=()=>{ if(idx==q.c) score++; i++; loadQuiz(); };
  box.appendChild(b);
 });
}
loadQuiz();

// RELATÓRIOS
function gerarRelatorio(){
 listarResultados(dados=>{
  let div=document.getElementById('relatorio');
  div.innerHTML='';

  let total=0;
  dados.forEach(r=>{
   total+=r.score;
   let el=document.createElement('div');
   el.className='card';
   el.innerText=`${r.aluno} - ${r.score}`;
   div.appendChild(el);
  });

  if(dados.length>0){
   let media=total/dados.length;
   let m=document.createElement('div');
   m.className='card';
   m.innerText='Média geral: '+media.toFixed(2);
   div.appendChild(m);
  }
 });
}

// PWA
if('serviceWorker' in navigator){
 const code=`self.addEventListener('fetch',e=>{});`;
 const blob=new Blob([code],{type:'text/javascript'});
 navigator.serviceWorker.register(URL.createObjectURL(blob));
}

</script>

</body>
</html>
